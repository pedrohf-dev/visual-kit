name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Check release version
        run: |
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if(m.version!==process.env.GITHUB_REF_NAME || p.version!==m.version) throw new Error('Tag and manifest/package versions must match exactly, without a v prefix');"
      - name: Install canvas build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Attest installable assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/visual-kit/main.js
            dist/visual-kit/manifest.json
            dist/visual-kit/styles.css
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "dist/visual-kit/$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish Obsidian release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/visual-kit/main.js \
            dist/visual-kit/manifest.json \
            dist/visual-kit/styles.css \
            --verify-tag --title "Visual Kit $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
